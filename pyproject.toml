[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-pilot"
version = "0.1.0"
description = "Persistent Playwright browser control with human handoffs and reusable workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.48,<2",
  "mcp>=1.12,<2",
  "keyring>=25,<27",
]

[project.scripts]
browser-pilot = "browser_pilot.cli:main"
browser-pilot-mcp = "browser_pilot.server:main"

[tool.setuptools.packages.find]
where = ["src"]
